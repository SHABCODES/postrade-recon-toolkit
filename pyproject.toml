[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postrade-recon-toolkit"
version = "1.0.0"
description = "Post-trade reconciliation toolkit: trade, position, cash, margin and pricing breaks with ageing, severity and Excel/VBA reporting"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.26", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
postrade-recon = "postrade_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
